<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>給与明細</title>
<style>
  html, body { margin: 0; background: #f4f6f3; color: #1f2a1c; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
  .card { max-width: 440px; margin: 24px auto; background: #fff; border-radius: 18px; padding: 22px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); line-height: 1.7; }
  a { color: #5d7828; font-weight: 700; }
</style>
<script>
// 給与明細は職員ポータル（clock/）へ移りました（2026-11-05）。このURL（slip/?k=…）は院長が配ったまま使えるように残し、ポータルへ送る。
// ks＝給与明細のキー（ポータルだけ使える。打刻はできない）
(function () {
  var k = new URLSearchParams(location.search).get('k') || '';
  if (k) location.replace('../clock/?ks=' + encodeURIComponent(k));
})();
</script>
</head>
<body>
<div class="card">
  <p>給与明細は「職員ポータル」に移りました。</p>
  <p>自動で移らないときは、院長から届いたURLか、休憩室のQRコードから開き直してください。</p>
</div>
</body>
</html>
